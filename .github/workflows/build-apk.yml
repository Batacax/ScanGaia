name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
            automake ccache gettext autopoint libltdl-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Caché de Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Compilar
        run: |
          set +o pipefail
          (yes | buildozer android debug) 2>&1 | tee build.log || true
          ls bin/*.apk   # falla solo si de verdad no se generó el APK

      - name: Publicar error como issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -v '^\s*$' build.log | tail -n 300 | cut -c1-300; echo '```'; } > tail.md
          gh issue create -R "$GITHUB_REPOSITORY" --title "Error de compilación #$GITHUB_RUN_NUMBER" --body-file tail.md

      - uses: actions/upload-artifact@v4
        with:
          name: ScanGaia-apk
          path: bin/*.apk
